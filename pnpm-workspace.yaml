onlyBuiltDependencies:
  - es5-ext
  - fsevents

# eslint-plugin-n8n-nodes-base's only lifecycle script is a `preinstall: npx
# only-allow pnpm` guard that we intentionally do not run (it's pointless for a
# dependency and needs network). Listing it here suppresses ERR_PNPM_IGNORED_BUILDS.
ignoredBuiltDependencies:
  - eslint-plugin-n8n-nodes-base

allowBuilds:
  eslint-plugin-n8n-nodes-base: true
  isolated-vm: true

# Force patched versions of transitive dependencies flagged by the OSV scan
# (see .github/workflows/security-cve.yml). Each entry pins the lowest release
# that carries the fix; drop an entry once the parent pulls in a patched
# version on its own.
#
# All of these are dev-only: brace-expansion arrives via eslint/gulp, and the
# rest via n8n-workflow, which is a devDependency here (n8n supplies it at
# runtime). Nothing here reaches published consumers.
overrides:
  brace-expansion@5: ^5.0.9 # GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  form-data: ^4.0.6 # GHSA-hmw2-7cc7-3qxx
  lodash: ^4.18.0 # GHSA-f23m-r3pf-42rh, GHSA-r5fr-rjxr-66jc
  uuid@10: ^11.1.1 # GHSA-w5hq-g745-h8pq
